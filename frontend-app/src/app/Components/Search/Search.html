<div class="container">
  <section class="search-card" aria-label="Search">
    <div class="search-row">
      <input
        [(ngModel)]="query"
        (input)="onSearch()"
        (keyup.enter)="onSearch()"
        class="search-input"
        type="search"
        placeholder="Search projects, docs, users..."
        aria-label="Search query"
        autocomplete="off"
      />
      <button class="search-btn" (click)="onSearch()" aria-label="Search">Search</button>
    </div>

    <div class="meta">{{ meta }}</div>

    <!-- Suggestions -->
    <div class="suggestions" *ngIf="query && suggestions.length > 0">
      <div
        class="chip"
        *ngFor="let s of suggestions"
        (click)="selectSuggestion(s.title)"
      >
        {{ s.title }}
      </div>
    </div>

    <!-- Results -->
    <div class="results" role="list" aria-live="polite">
      <div
        class="result"
        *ngFor="let r of results"
        role="listitem"
        (click)="openResult(r)"
      >
        <div class="title">{{ r.title }}</div>
        <div class="snippet">{{ r.snippet }}</div>
      </div>
      <div *ngIf="results.length === 0 && query" class="empty">No results</div>
    </div>
  </section>
</div>
